services:
  - type: web
    name: phoenix-chess-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r src/backend/requirements-chess.txt
    startCommand: cd src/backend && uvicorn chess_app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
