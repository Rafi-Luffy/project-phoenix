name: Code Quality & Linting

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'backend/**'
      - '.github/workflows/code-quality.yml'
  pull_request:
    branches:
      - main
      - develop
  schedule:
    - cron: '0 0 * * 1'  # Weekly on Monday

jobs:
  linting:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install linting tools
        run: |
          pip install flake8 black isort pylint bandit

      - name: Run flake8
        run: |
          flake8 backend/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 backend/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics
        continue-on-error: true

      - name: Check code formatting with black
        run: |
          black --check backend/ tests/
        continue-on-error: true

      - name: Check import sorting
        run: |
          isort --check-only backend/ tests/
        continue-on-error: true

      - name: Run pylint
        run: |
          pylint backend/ --disable=all --enable=E,F --fail-under=9.0 || true
        continue-on-error: true

      - name: Security check with bandit
        run: |
          bandit -r backend/ -f json -o bandit-report.json || true
        continue-on-error: true

  type-checking:
    name: Type Checking
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install type checking tools
        run: |
          pip install mypy types-all
          pip install -r requirements.txt

      - name: Run mypy
        run: |
          mypy backend/ --ignore-missing-imports || true
        continue-on-error: true

  dependency-check:
    name: Dependency Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Check dependencies
        run: |
          pip install safety pip-audit
          safety check --json > safety-report.json || true
          pip-audit
        continue-on-error: true

      - name: Upload dependency report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: dependency-reports
          path: safety-report.json

  sast:
    name: Static Application Security Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/owasp-top-ten
            p/python
        continue-on-error: true

  code-coverage:
    name: Code Coverage Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install test dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov coverage

      - name: Run tests with coverage
        run: |
          pytest tests/ --cov=backend --cov-report=xml --cov-report=term-missing
        continue-on-error: true

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: coverage
          name: codecov-coverage

      - name: Check coverage threshold
        run: |
          coverage report --fail-under=80 || echo "Coverage below 80%"
        continue-on-error: true
