name: Run Integration Tests

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'backend/**'
      - 'tests/**'
      - 'Dockerfile.backend'
      - 'requirements.txt'
      - '.github/workflows/test-integration.yml'
  pull_request:
    branches:
      - main
      - develop
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: phoenix
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: phoenix_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio pytest-docker httpx

      - name: Wait for services
        run: |
          pip install psycopg2-binary redis
          python << 'EOF'
          import psycopg2
          import redis
          import time
          
          # Wait for PostgreSQL
          for i in range(30):
              try:
                  conn = psycopg2.connect(
                      host='localhost',
                      user='phoenix',
                      password='test_password',
                      database='phoenix_test'
                  )
                  conn.close()
                  print("PostgreSQL is ready!")
                  break
              except:
                  time.sleep(1)
          
          # Wait for Redis
          for i in range(30):
              try:
                  r = redis.Redis(host='localhost', port=6379)
                  r.ping()
                  print("Redis is ready!")
                  break
              except:
                  time.sleep(1)
          EOF

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://phoenix:test_password@localhost:5432/phoenix_test
          REDIS_URL: redis://localhost:6379/0
          TESTING: 'true'
        run: |
          pytest tests/integration/ -v --cov=backend --cov-report=xml --cov-report=html

      - name: Run API endpoint tests
        env:
          DATABASE_URL: postgresql://phoenix:test_password@localhost:5432/phoenix_test
          REDIS_URL: redis://localhost:6379/0
          TESTING: 'true'
        run: |
          pytest tests/api/ -v --cov=backend --cov-report=xml --cov-append

      - name: Run database tests
        env:
          DATABASE_URL: postgresql://phoenix:test_password@localhost:5432/phoenix_test
          REDIS_URL: redis://localhost:6379/0
          TESTING: 'true'
        run: |
          pytest tests/database/ -v --cov=backend --cov-report=xml --cov-append

      - name: Run cache tests
        env:
          DATABASE_URL: postgresql://phoenix:test_password@localhost:5432/phoenix_test
          REDIS_URL: redis://localhost:6379/0
          TESTING: 'true'
        run: |
          pytest tests/cache/ -v --cov=backend --cov-report=xml --cov-append

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: integration
          name: integration-tests

      - name: Generate test report
        if: always()
        run: |
          pytest tests/ --html=report.html --self-contained-html || true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-report
          path: |
            report.html
            htmlcov/

  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install locust pytest-benchmark memory_profiler

      - name: Run performance benchmarks
        run: |
          pytest tests/performance/ -v --benchmark-only || true

      - name: Run load testing
        run: |
          echo "Load testing placeholder"
        continue-on-error: true

      - name: Check memory usage
        run: |
          python -m memory_profiler backend/main.py || true
        continue-on-error: true

  end-to-end-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start services with Docker Compose
        run: |
          docker compose -f docker-compose.yml up -d
          sleep 10

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          pip install requests pytest pytest-asyncio httpx

      - name: Run E2E tests
        run: |
          pytest tests/e2e/ -v --tb=short || true

      - name: Collect logs
        if: always()
        run: |
          docker compose -f docker-compose.yml logs > docker-logs.txt

      - name: Stop services
        if: always()
        run: |
          docker compose -f docker-compose.yml down

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: docker-logs
          path: docker-logs.txt
