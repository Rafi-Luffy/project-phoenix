  <!-- Phoenix / loop / infinity-style mark -->
  <!-- Left loop -->
  <path d="M 14 32 C 14 22 22 16 30 22 C 34 25 36 29 36 32" 
        stroke="#f97316" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Right loop -->
  <path d="M 50 32 C 50 22 42 16 34 22 C 30 25 28 29 28 32" 
        stroke="#fb923c" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Lower left loop -->
  <path d="M 36 32 C 36 35 34 39 30 42 C 22 48 14 42 14 32" 
        stroke="#f97316" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Lower right loop -->
  <path d="M 28 32 C 28 35 30 39 34 42 C 42 48 50 42 50 32" 
        stroke="#fb923c" stroke-width="3" stroke-linecap="round" fill="none"/>
  
  <!-- Center dot at crossing -->
