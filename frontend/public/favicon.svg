  <!-- Phoenix flame tips -->
  <path d="M 32 12 L 29 18 L 32 16 L 35 18 Z" fill="#f97316" opacity="0.9"/>
  <path d="M 32 52 L 29 46 L 32 48 L 35 46 Z" fill="#fb923c" opacity="0.7"/>
