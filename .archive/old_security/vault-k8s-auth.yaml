# Vault Kubernetes Authentication for Project Phoenix
# Enable Kubernetes pods to authenticate to Vault without secrets

apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: phoenix

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vault-auth
rules:
- apiGroups: [""]
  resources: ["serviceaccounts/token"]
  verbs: ["create"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-auth
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vault-auth
subjects:
- kind: ServiceAccount
  name: vault-auth
  namespace: phoenix

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-config
  namespace: phoenix
data:
  vault-addr: https://vault.vault.svc.cluster.local:8200
  vault-namespace: ""
  k8s-auth-path: "auth/kubernetes"
  vault-role: "phoenix-app"

---
# Script to enable Kubernetes auth and configure Vault policies
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-init-script
  namespace: vault
data:
  init.sh: |
    #!/bin/bash
    set -e
    
    VAULT_ADDR="${VAULT_ADDR:-https://127.0.0.1:8200}"
    VAULT_TOKEN="${VAULT_TOKEN}"
    
    echo "Enabling Kubernetes auth method..."
    vault auth enable kubernetes || true
    
    echo "Configuring Kubernetes auth..."
    vault write auth/kubernetes/config \
      kubernetes_host="$KUBERNETES_SERVICE_HOST:$KUBERNETES_SERVICE_PORT" \
      kubernetes_ca_cert=@/var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
      token_reviewer_jwt=@/var/run/secrets/kubernetes.io/serviceaccount/token
    
    echo "Creating role for Phoenix app..."
    vault write auth/kubernetes/role/phoenix-app \
      bound_service_account_names=vault-auth \
      bound_service_account_namespaces=phoenix \
      policies=phoenix-policy \
      ttl=1h
    
    echo "Creating policy for Phoenix app..."
    vault policy write phoenix-policy - <<EOF
    # Allow reading application secrets
    path "secret/data/phoenix/*" {
      capabilities = ["read", "list"]
    }
    
    # Allow reading database credentials
    path "database/creds/phoenix-app" {
      capabilities = ["read"]
    }
    
    # Allow reading API keys
    path "secret/data/api-keys/*" {
      capabilities = ["read"]
    }
    
    # Allow reading TLS certificates
    path "pki/issue/phoenix-cert" {
      capabilities = ["create", "update"]
    }
    
    # Allow renewing token
    path "auth/token/renew-self" {
      capabilities = ["update"]
    }
    
    # Allow lookup self
    path "auth/token/lookup-self" {
      capabilities = ["read"]
    }
    EOF
    
    echo "Setting up database dynamic credentials..."
    vault secrets enable database || true
    
    vault write database/config/postgres \
      plugin_name=postgresql-database-plugin \
      allowed_roles="phoenix-app,readonly" \
      connection_url="postgresql://{{username}}:{{password}}@postgres:5432/phoenix" \
      username="vault_admin" \
      password="${DB_VAULT_ADMIN_PASSWORD}"
    
    vault write database/roles/phoenix-app \
      db_name=postgres \
      creation_statements="CREATE ROLE \"{{name}}\" WITH LOGIN PASSWORD '{{password}}' VALID UNTIL '{{expiration}}'; GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO \"{{name}}\";" \
      default_ttl="1h" \
      max_ttl="24h"
    
    echo "Vault initialization complete!"

---
# Kubernetes RBAC configuration for Vault
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault
  namespace: vault

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vault
rules:
- apiGroups: [""]
  resources: ["serviceaccounts", "serviceaccounts/token"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vault
subjects:
- kind: ServiceAccount
  name: vault
  namespace: vault

---
# Example secret in Vault format
apiVersion: v1
kind: Secret
metadata:
  name: vault-unseal-keys
  namespace: vault
type: Opaque
stringData:
  # These should be stored securely in AWS Secrets Manager or similar
  unseal_key_1: "PLACEHOLDER"
  unseal_key_2: "PLACEHOLDER"
  unseal_key_3: "PLACEHOLDER"
  root_token: "PLACEHOLDER"
