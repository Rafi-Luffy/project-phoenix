# SSL/TLS Certificate Management Script for Project Phoenix
# Uses cert-manager for automatic certificate provisioning and renewal

apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager

---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: certificates.cert-manager.io
  namespace: cert-manager
spec:
  names:
    kind: Certificate
    plural: certificates
  scope: Namespaced
  group: cert-manager.io
  versions:
  - name: v1
    served: true
    storage: true

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cert-manager
  namespace: cert-manager

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cert-manager
rules:
- apiGroups: ["cert-manager.io"]
  resources: ["certificates", "issuers", "clusterissuers"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cert-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cert-manager
subjects:
- kind: ServiceAccount
  name: cert-manager
  namespace: cert-manager

---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@phoenixproject.io
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
    - http01:
        ingress:
          class: nginx
    - dns01:
        route53:
          region: us-east-1
          hostedZoneID: Z1234567890ABC
          accessKeyID: AKIAIOSFODNN7EXAMPLE
          secretAccessKeySecretRef:
            name: route53-credentials
            key: access-key-secret

---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: admin@phoenixproject.io
    privateKeySecretRef:
      name: letsencrypt-staging-key
    solvers:
    - http01:
        ingress:
          class: nginx

---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned-issuer
  namespace: phoenix
spec:
  selfSigned: {}

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: phoenix-api-tls
  namespace: phoenix
spec:
  secretName: phoenix-api-tls-secret
  duration: 2160h # 90 days
  renewBefore: 720h # 30 days
  commonName: api.phoenixproject.io
  dnsNames:
  - api.phoenixproject.io
  - "*.api.phoenixproject.io"
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-tls
  namespace: vault
spec:
  secretName: vault-tls-secret
  duration: 2160h # 90 days
  renewBefore: 720h # 30 days
  commonName: vault.service.consul
  dnsNames:
  - vault.service.consul
  - vault.vault.svc.cluster.local
  - vault-0.vault.vault.svc.cluster.local
  - vault-1.vault.vault.svc.cluster.local
  - vault-2.vault.vault.svc.cluster.local
  issuerRef:
    name: selfsigned-issuer
    kind: Issuer

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: postgres-client-cert
  namespace: phoenix
spec:
  secretName: postgres-client-cert
  duration: 2160h
  renewBefore: 720h
  commonName: phoenix-api
  usages:
  - digital signature
  - key encipherment
  - client auth
  issuerRef:
    name: selfsigned-issuer
    kind: Issuer

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: redis-client-cert
  namespace: phoenix
spec:
  secretName: redis-client-cert
  duration: 2160h
  renewBefore: 720h
  commonName: phoenix-api
  usages:
  - digital signature
  - key encipherment
  - client auth
  issuerRef:
    name: selfsigned-issuer
    kind: Issuer
