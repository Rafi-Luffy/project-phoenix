# Docker Compose for Integration Testing
# Provides PostgreSQL, Redis, and other services for testing

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: phoenix-test-postgres
    environment:
      POSTGRES_USER: phoenix_test
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: phoenix_test
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phoenix_test"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - phoenix-test-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: phoenix-test-redis
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_test_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - phoenix-test-network

  # Elasticsearch (for Loki/logging tests)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.0.0
    container_name: phoenix-test-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9201:9200"
      - "9301:9300"
    volumes:
      - elasticsearch_test_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health?wait_for_status=yellow || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - phoenix-test-network

  # Localstack (AWS mocking)
  localstack:
    image: localstack/localstack:latest
    container_name: phoenix-test-localstack
    environment:
      - SERVICES=s3,lambda,sqs,sns,dynamodb
      - DEBUG=1
      - DATA_DIR=/tmp/localstack/data
      - DOCKER_HOST=unix:///var/run/docker.sock
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
    ports:
      - "4566:4566"
      - "4571:4571"
    volumes:
      - localstack_test_data:/tmp/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - phoenix-test-network

  # Jaeger (tracing)
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: phoenix-test-jaeger
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
    ports:
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "5778:5778"
      - "16686:16686"
      - "14250:14250"
      - "14268:14268"
      - "14269:14269"
      - "9411:9411"
    networks:
      - phoenix-test-network

networks:
  phoenix-test-network:
    driver: bridge

volumes:
  postgres_test_data:
  redis_test_data:
  elasticsearch_test_data:
  localstack_test_data:
