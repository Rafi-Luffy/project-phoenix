# Loki Logging Configuration
# Centralized log aggregation and analysis
# Version: 1.0.0
# Updated: December 28, 2025

---
auth_enabled: false

ingester:
  chunk_idle_period: 3m
  chunk_retain_period: 1m
  max_chunk_age: 1h
  chunk_encoding: snappy
  lifecycler:
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1

limits_config:
  enforce_metric_name: false
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  ingestion_rate_mb: 256
  ingestion_burst_size_mb: 512
  max_entries_limit_per_second: 100000
  max_cache_freshness_per_query: 10m
  split_queries_by_interval: 24h
  max_query_length: 720h
  cardinality_limit: 100000
  max_streams_matchers_per_query: 1000

# Distributor configuration
distributor:
  ring:
    kvstore:
      store: inmemory

# Querier configuration
querier:
  query_timeout: 5m
  cache_results: true
  max_concurrent: 10

# Query frontend configuration
query_range:
  align_queries_with_step: true
  cache_results: true
  max_cache_freshness_per_query: 10m
  compression: snappy
  downstream_url: http://querier:3100

# Schema configuration
schema_config:
  configs:
    - from: 2020-10-24
      store: boltdb-shipper
      object_store: filesystem
      schema: v12
      index:
        prefix: loki_index_
        period: 24h

# Storage configuration
storage_config:
  boltdb_shipper:
    active_index_directory: /loki/index
    cache_location: /loki/boltdb-cache
    shared_store: filesystem
  filesystem:
    directory: /loki/chunks

# Server configuration
server:
  http_listen_port: 3100
  log_level: info
  log_format: json
  grpc_server_max_recv_msg_size: 104857600
  grpc_server_max_send_msg_size: 104857600
  grpc_server_max_concurrent_streams: 1000

# Scrape configuration
scrape_configs:
  # Kubernetes pod logs via Promtail
  - job_name: kubernetes-pods
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      # Extract namespace
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: namespace
      
      # Extract pod name
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: pod
      
      # Extract pod labels
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)
      
      # Extract container name
      - source_labels: [__meta_kubernetes_pod_container_name]
        action: replace
        target_label: container
      
      # Only scrape phoenix namespace
      - source_labels: [__meta_kubernetes_namespace]
        action: keep
        regex: phoenix|kube-system|loki

  # Kubernetes events
  - job_name: kubernetes-events
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - phoenix
    relabel_configs:
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: pod

# Chunk encoding
chunk_encoding: snappy

# Cache configuration
cache_config:
  enable_fifocache: true
  default_validity: 1h
  background:
    writeback_goroutines: 10
    writeback_delay: 5s

# Retention configuration
retention_deletes_enabled: true
retention_period: 720h  # 30 days

# Metrics configuration
metrics:
  enabled: true
  server:
    http_listen_port: 3100

# Tracing configuration
tracing:
  enabled: false
  # Uncomment to enable Jaeger tracing
  # jaeger:
  #   sampler:
  #     type: const
  #     param: 1
  #   reporter_log_spans: true
  #   endpoint: http://jaeger:14268/api/traces
